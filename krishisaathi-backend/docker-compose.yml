services:
  mysql:
    image: mysql:8.0
    container_name: krishisaathi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: krishisaathi
      MYSQL_DATABASE: krishisaathi
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pkrishisaathi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: krishisaathi-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
